search:
  oneshot_check_len: 0.02
  oneshot_range    : 1.0

  traj_forward_penalty     : 1.0
  traj_back_penalty        : 3.0
  traj_gear_switch_penalty : 10.0
  traj_steer_penalty       : 5.0
  traj_steer_change_penalty: 2.0

  # Bound repeated mobile-base searches so one goal cannot consume tens of seconds.
  try_astar_times: 3

  yaw_resolution    : 3.15
  max_arc           : 0.4
  min_turning_radius: 0.2
  lambda_heu        : 1
  # The real locomotive cloud can force a long detour; 1 s was not enough to
  # find the around-the-cloud route in the enlarged map.
  max_seach_time    : 15.0
  # Forbid lateral detours: the base must stay within this half-width (m) of
  # the straight start->goal line. <=0 disables the constraint.
  lateral_corridor  : 0.3
  check_num         : 8
  dist_resolution   : 0.2
  sample_time       : 0.1
  curvatureDisCoe   : 0.4
  # The large map plus a forced detour around the locomotive can expand more
  # than 100k hybrid-A* nodes; 100k made the base search report "run out of
  # memory" (NO_PATH) before finding the route.
  allocate_num      : 800000

  # Target-specific tuning for the saved locomotive PCD route: leave more
  # probability for guided/local configuration-space samples.
  goal_rate: 0.55
  guided_sample_rate: 0.50
  local_sample_rate: 0.35
  local_sample_std: 0.35
  max_loop_num: 5000
  # Use per-base-trajectory-layer IK candidates for the locomotive PCD scene.
  # The legacy shared-posture and stationary-arm shortcuts are disabled so
  # every base layer gets its own collision-checked IK candidates.
  enable_shared_posture_fast_path: false
  # The layered route is primary; when no per-layer candidate can connect,
  # fall back to one globally safe folded posture (some undercarriage
  # bottlenecks have no reachable Cartesian candidate at all).
  enable_shared_posture_fallback: true
  cartesian_samples_per_layer: 256
  cartesian_sample_radius_xy: 0.32
  # Extend local IK resampling toward the locomotive undercarriage.
  cartesian_sample_z_min: 0.85
  cartesian_sample_z_max: 1.80
  max_sample_time: 0.2
  # The arm must be able to reconfigure while the base crosses the bar.
  # 50 ms was too short for the joint-space RRT to find that coupled path.
  max_mani_search_time: 20.0

optimize:
  # Hold the accepted front-end IK joint waypoints fixed through the backend
  # minimum-snap optimization for the fixed locomotive scene.
  preserve_frontend_joint_waypoints: true
  hard_waypoint_weight: 100000000.0

optimization:
  weight_obstacle               : 50000.0
  weight_manipulator_self       : 1000.0
  weight_base_feasibility       : 100.0
  weight_manipulator_feasibility: 100.0
  # Avoid shortening the initial base trajectory so aggressively that wheel
  # acceleration becomes infeasible and forces repeated replans.
  # Keep the collision-checked frontend segment durations; shortening them
  # makes the snap curve exceed the arm acceleration limit.
  weight_time                   : 0.0

  ground_safe_dis        : 0.03
  safe_margin            : 0.10
  safe_margin_mani       : 0.10
  self_safe_margin       : 0.03
  ground_safe_margin     : 0.03

  mobile_base_opt_gear: true
  constrain_points_perPiece: 16
  dense_sample_resolution: 16

fsm:
  target_type  : 1
  time_for_gripper: 0.05

  # 3D end-effector goal: click a point in RViz (Publish Point -> /clicked_point)
  # to move the mobile base + arm until the end-effector reaches that world point.
  ee_goal_reach_xy_min: 0.25   # keep the current base when the point is this close
  ee_goal_reach_xy_max: 1.10   # ... or this far (arm workspace in XY)
  ee_goal_standoff   : 0.75    # preferred base-to-point distance when it moves
  ee_goal_clearance  : 0.05    # fallback pull-back, used only when the exact point has no collision-free IK
  ee_goal_z_min      : 0.15    # reachable point height in world (base_link z = 0)
  ee_goal_z_max      : 2.00
  ee_goal_ik_samples : 20      # extra collision-free LM seeds per base standoff (position-only LMA IK)

  thresh_replan_time: 2.5
  replan_trajectory_time: 1.7
  planning_horizon: 5.0
  global_plan: true
  emergency_time: 1.5

grid_map:
  use_load_map: true
  use_global_map: true
